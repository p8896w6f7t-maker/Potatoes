<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>영상미디어와 사회 단답형 문제</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f5f6f8;
        color: #222;
        font-family:

            BlinkMacSystemFont,
            "Noto Sans KR",
            "Malgun Gothic",
            sans-serif;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 30px 20px 80px;
    }

    /* 상단 */
    .header {
        background: white;
        border-radius: 18px;
        padding: 28px;
        margin-bottom: 20px;
        border: 1px solid #e5e7eb;
    }

    .header h1 {
        margin: 0 0 10px;
        font-size: 28px;
    }

    .header p {
        margin: 0;
        color: #666;
        line-height: 1.6;
    }

    /* 진행률 */
    .progress-box {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(245,246,248,0.95);
        padding: 12px 0;
        backdrop-filter: blur(8px);
    }

    .progress-text {
        font-size: 14px;
        color: #555;
        margin-bottom: 7px;
    }

    .progress {
        width: 100%;
        height: 8px;
        background: #ddd;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-bar {
        width: 0%;
        height: 100%;
        background: #222;
        transition: width 0.2s;
    }

    /* 섹션 */
    .section-title {
        margin-top: 35px;
        margin-bottom: 15px;
        font-size: 21px;
        font-weight: 800;
        border-left: 5px solid #222;
        padding-left: 12px;
    }

    /* 문제 */
    .question-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 13px;
        transition: 0.2s;
    }

    .question-card.correct {
        border: 2px solid #22c55e;
        background: #f5fff8;
    }

    .question-card.wrong {
        border: 2px solid #ef4444;
        background: #fff7f7;
    }

    .question-number {
        display: inline-block;
        background: #eef0ff;
        color: #3730a3;
        border-radius: 7px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 10px;
    }

    .question {
        font-size: 17px;
        line-height: 1.7;
        font-weight: 600;
    }

    input {
        width: 100%;
        margin-top: 15px;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #555;
        box-shadow: 0 0 0 3px #eee;
    }

    .feedback {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.5;
    }

    .correct-text {
        color: #15803d;
        font-weight: 800;
    }

    .wrong-text {
        color: #dc2626;
        font-weight: 800;
    }

    .answer-text {
        margin-top: 5px;
        color: #555;
    }

    /* 결과 */
    .result {
        display: none;
        background: white;
        border: 2px solid #222;
        border-radius: 15px;
        padding: 25px;
        margin-top: 25px;
        text-align: center;
    }

    .score {
        font-size: 42px;
        font-weight: 900;
        margin: 10px 0;
    }

    /* 버튼 */
    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 13px 20px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
    }

    .btn-primary {
        background: #222;
        color: white;
    }

    .btn-secondary {
        background: white;
        border: 1px solid #ccc;
        color: #222;
    }

    button:hover {
        opacity: 0.85;
    }

    /* 모바일 */
    @media (max-width: 600px) {

        .container {
            padding: 20px 13px 60px;
        }

        .header h1 {
            font-size: 23px;
        }

        .question {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <p>
            3개 PDF 기반 단답형 문제<br>
            정답을 직접 입력하고 채점하세요.
        </p>
    </div>

    <div class="progress-box">
        <div class="progress-text">

        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div id="quiz"></div>

    <div class="buttons">

        <button class="btn-primary" onclick="gradeQuiz()">
            채점하기
        </button>

        <button class="btn-secondary" onclick="showAnswers()">
            정답 보기
        </button>

        <button class="btn-secondary" onclick="resetQuiz()">
            다시 풀기
        </button>

    </div>

    <div class="result" id="result"></div>

</div>

/* =========================================================
   문제 출력
   ========================================================= */

const quiz = document.getElementById("quiz");

document.getElementById("total").textContent = questions.length;

let currentSection = "";

questions.forEach((item, index) => {

    if (item.section !== currentSection) {

        currentSection = item.section;

        const sectionTitle = document.createElement("div");

        sectionTitle.className = "section-title";

        sectionTitle.textContent = currentSection;

        quiz.appendChild(sectionTitle);
    }


    const card = document.createElement("div");

    card.className = "question-card";

    card.id = "question-" + index;


    card.innerHTML = `

        <div class="question-number">
            ${index + 1}번
        </div>

        <div class="question">
            ${escapeHTML(item.q)}
        </div>

        <input
            type="text"
            id="answer-${index}"
            placeholder="정답을 입력하세요"
            autocomplete="off"
        >

        <div
            class="feedback"
            id="feedback-${index}"
        ></div>

    `;


    quiz.appendChild(card);
});


/* =========================================================
   HTML 특수문자 처리
   ========================================================= */

function escapeHTML(text) {

    return String(text).replace(/[&<>"']/g, function(char) {

        const entities = {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

        };

        return entities[char];

    });

}


/* =========================================================
   정답 비교용 정리
   ---------------------------------------------------------
   띄어쓰기, 대소문자, 일부 기호를 무시함.
   ========================================================= */

function normalize(text) {

    return String(text || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[·•ㆍ,，.。()（）'"“”‘’\-_/]/g, "");

}


function checkAnswer(userAnswer, answers) {

    const user = normalize(userAnswer);

    return answers.some(function(answer) {

        return normalize(answer) === user;

    });

}


/* =========================================================
   입력 진행률
   ========================================================= */

function updateProgress() {

    let count = 0;

    questions.forEach(function(_, index) {

        const input =
            document.getElementById("answer-" + index);

        if (input.value.trim() !== "") {

            count++;

        }

    });


    document.getElementById("answered").textContent = count;


    const percent =
        (count / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        percent + "%";

}


/* =========================================================
   입력할 때마다 진행률 갱신
   ========================================================= */

questions.forEach(function(_, index) {

    const input =
        document.getElementById("answer-" + index);

    input.addEventListener("input", updateProgress);

});


/* =========================================================
   채점
   ========================================================= */

function gradeQuiz() {

    let score = 0;

    questions.forEach(function(item, index) {

        const input =
            document.getElementById("answer-" + index);

        const card =
            document.getElementById("question-" + index);

        const feedback =
            document.getElementById("feedback-" + index);


        const userAnswer = input.value;


        card.classList.remove("correct");
        card.classList.remove("wrong");


        if (checkAnswer(userAnswer, item.a)) {

            score++;

            card.classList.add("correct");

            feedback.innerHTML = `
                <div class="correct-text">
                    ✓ 정답
                </div>
            `;

        } else {

            card.classList.add("wrong");

            feedback.innerHTML = `
                <div class="wrong-text">
                    ✕ 오답
                </div>

                <div class="answer-text">
                    정답: <strong>${escapeHTML(item.a[0])}</strong>
                </div>
            `;

        }

    });


    const wrong =
        questions.length - score;

    const percent =
        Math.round((score / questions.length) * 100);


    const result =
        document.getElementById("result");


    result.style.display = "block";


    result.innerHTML = `

        <div>채점 결과</div>

        <div class="score">
            ${score} / ${questions.length}
        </div>

        <div>
            ${percent}점
        </div>

        <br>

        <div>
            맞은 문제 ${score}개
            ·
            틀린 문제 ${wrong}개
        </div>

    `;


    result.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* =========================================================
   정답 보기
   ========================================================= */

function showAnswers() {

    questions.forEach(function(item, index) {

        const feedback =
            document.getElementById("feedback-" + index);


        feedback.innerHTML = `

            <div class="answer-text">

                정답:
                <strong>
                    ${escapeHTML(item.a[0])}
                </strong>

            </div>

        `;

    });

}


/* =========================================================
   다시 풀기
   ========================================================= */

function resetQuiz() {

    questions.forEach(function(_, index) {

        const input =
            document.getElementById("answer-" + index);

        const card =
            document.getElementById("question-" + index);

        const feedback =
            document.getElementById("feedback-" + index);


        input.value = "";

        card.classList.remove("correct");
        card.classList.remove("wrong");

        feedback.innerHTML = "";

    });


    document.getElementById("result").style.display = "none";


    updateProgress();


    window.scrollTo({

        top: 0,
        behavior: "smooth"

    });

}


/* =========================================================
   시작
   ========================================================= */

updateProgress();

</script>
