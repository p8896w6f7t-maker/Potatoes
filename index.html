<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상미디어와 사회 - 단답형 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: #f3f4f6;
    color: #202124;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 18px 60px; }
  header {
    background: #111827;
    color: white;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 18px;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .desc { color: #d1d5db; line-height: 1.6; }
  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin: 16px 0;
  }
  button {
    border: 0; border-radius: 10px; padding: 12px 18px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .primary { background: #111827; color: white; }
  .secondary { background: white; border: 1px solid #d1d5db; }
  .card {
    background: white; border-radius: 14px; padding: 20px;
    margin: 12px 0; border: 1px solid #e5e7eb;
  }
  .num {
    display: inline-block; font-size: 12px; font-weight: 800;
    background: #eef2ff; color: #3730a3; padding: 5px 8px;
    border-radius: 7px; margin-bottom: 10px;
  }
  .question { font-size: 17px; line-height: 1.65; font-weight: 650; }
  .source { font-size: 12px; color: #6b7280; margin-top: 8px; }
  input {
    width: 100%; margin-top: 14px; padding: 13px 14px;
    border: 1px solid #d1d5db; border-radius: 9px;
    font-size: 16px; outline: none;
  }
  input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px #e0e7ff; }
  .result {
    display: none; background: white; border-radius: 14px; padding: 22px;
    margin: 18px 0; border: 2px solid #111827;
  }
  .result h2 { margin-top: 0; }
  .score { font-size: 34px; font-weight: 900; }
  .wrong {
    border-color: #fecaca;
    background: #fff7f7;
  }
  .correct {
    border-color: #bbf7d0;
    background: #f5fff8;
  }
  .feedback { margin-top: 10px; font-size: 14px; line-height: 1.5; }
  .answer { font-weight: 800; color: #166534; }
  .hidden { display: none; }
  .section {
    margin-top: 28px; font-size: 20px; font-weight: 900;
    padding-bottom: 8px; border-bottom: 2px solid #111827;
  }
  .progress {
    position: sticky; top: 0; z-index: 10;
    background: rgba(243,244,246,.95); padding: 10px 0;
    backdrop-filter: blur(8px);
  }
  .bar { height: 8px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: #111827; transition: width .2s; }
  .small { font-size: 13px; color: #6b7280; margin: 6px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>영상미디어와 사회 단답형 퀴즈</h1>
    <div class="desc">
      업로드한 3개 PDF의 내용을 바탕으로 만든 단답형 문제입니다.<br>
      총 40문제 · 직접 정답 입력 · 제출 후 자동 채점
    </div>
  </header>

  <div class="progress">
    <div class="small"><span id="answered">0</span> / 40문제 입력</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div id="quiz"></div>

  <div class="toolbar">
    <button class="primary" onclick="grade()">채점하기</button>
    <button class="secondary" onclick="showAnswers()">정답 보기</button>
    <button class="secondary" onclick="resetQuiz()">다시 풀기</button>
  </div>

  <div id="result" class="result"></div>
</div>

<script>

  {q:"현재 미디어를 설명할 때, 가운데에 있으면서 무엇인가를 전달하거나 이어주는 수단·도구를 무엇이라고 하는가?", a:["미디어","media"], s:"영상미디어와 사회1"},

  {q:"아날로그 콘텐츠의 형태 중 출판의 대표적인 예로 제시된 것은?", a:["도서","책"], s:"영상미디어와 사회1"},
  {q:"아날로그 콘텐츠의 형태 중 신문은 어떤 종류의 콘텐츠 형태로 제시되었는가?", a:["신문"], s:"영상미디어와 사회1"},
  {q:"아날로그 음반의 형태로 제시된 검은색 원판은?", a:["LP","lp"], s:"영상미디어와 사회1"},
  {q:"아날로그 음반의 형태 중 CD를 재생하는 기기는?", a:["CD 플레이어","cd플레이어","씨디 플레이어"], s:"영상미디어와 사회1"},
  {q:"아날로그 음반의 형태 중 테이프를 사용하는 것은?", a:["카세트테이프","카세트 테이프","cassette tape"], s:"영상미디어와 사회1"},
  {q:"디지털 콘텐츠 디바이스의 예로 스마트폰, 태블릿 PC와 함께 제시된 것은?", a:["AI 글래스","ai글래스","AI글래스"], s:"영상미디어와 사회1"},

];

const quiz = document.getElementById("quiz");

function render() {
  quiz.innerHTML = "";
  let currentSection = "";
  questions.forEach((item, i) => {
    if (item.s !== currentSection) {
      currentSection = item.s;
      const sec = document.createElement("div");
      sec.className = "section";
      sec.textContent = currentSection;
      quiz.appendChild(sec);
    }
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + i;
    card.innerHTML = `
      <div class="num">${i+1}번</div>
      <div class="question">${escapeHtml(item.q)}</div>
      <div class="source">${escapeHtml(item.s)} 내용 기반</div>
      <input type="text" id="ans-${i}" placeholder="정답을 입력하세요" autocomplete="off"
             oninput="updateProgress()">
      <div class="feedback" id="feedback-${i}"></div>
    `;
    quiz.appendChild(card);
  });
}

function normalize(str) {
  return String(str || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace(/[·•ㆍ,，.。()（）'"“”‘’\-_/]/g, "");
}

function isCorrect(user, accepted) {
  const u = normalize(user);
  return accepted.some(x => normalize(x) === u);
}

function grade() {
  let score = 0;
  questions.forEach((item, i) => {
    const input = document.getElementById("ans-" + i);
    const card = document.getElementById("card-" + i);
    const feedback = document.getElementById("feedback-" + i);
    const user = input.value;

    card.classList.remove("correct", "wrong");
    feedback.innerHTML = "";

    if (isCorrect(user, item.a)) {
      score++;
      card.classList.add("correct");
      feedback.innerHTML = "정답";
    } else {
      card.classList.add("wrong");
      feedback.innerHTML = `오답 · 정답: <span class="answer">${escapeHtml(item.a[0])}</span>`;
    }
  });

  const percent = Math.round(score / questions.length * 100);
  const result = document.getElementById("result");
  result.style.display = "block";
  result.innerHTML = `
    <h2>채점 결과</h2>
    <div class="score">${score} / ${questions.length}</div>
    <p>${percent}점 · 맞은 문제 ${score}개 · 틀린 문제 ${questions.length - score}개</p>
  `;
  window.scrollTo({top: document.body.scrollHeight, behavior:"smooth"});
}

function showAnswers() {
  questions.forEach((item, i) => {
    document.getElementById("feedback-" + i).innerHTML =
      `정답: <span class="answer">${escapeHtml(item.a[0])}</span>`;
  });
}

function resetQuiz() {
  questions.forEach((_, i) => {
    document.getElementById("ans-" + i).value = "";
    document.getElementById("card-" + i).classList.remove("correct","wrong");
    document.getElementById("feedback-" + i).innerHTML = "";
  });
  document.getElementById("result").style.display = "none";
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}

function updateProgress() {
  let n = 0;
  questions.forEach((_, i) => {
    if (document.getElementById("ans-" + i).value.trim()) n++;
  });
  document.getElementById("answered").textContent = n;
  document.getElementById("fill").style.width = (n / questions.length * 100) + "%";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

render();
updateProgress();
</script>
</body>
</html>
